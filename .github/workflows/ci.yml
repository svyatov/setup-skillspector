name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clean skills pass
        id: pass
        uses: ./
        with:
          path: tests/fixtures/pass

      - name: Risky skill fails
        id: risky
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/fail

      - name: Baseline suppresses the risky skill
        uses: ./
        with:
          path: tests/fixtures/fail/risky
          baseline: tests/fixtures/baseline.yaml

      - name: Install only
        id: install
        uses: ./
        with:
          scan: false

      - name: Check results
        shell: bash
        env:
          REPORTS: ${{ steps.pass.outputs.report-dir }}
          RISKY: ${{ steps.risky.outcome }}
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          set -eu
          test -s "$REPORTS/alpha.md"
          test -s "$REPORTS/beta.md"
          test -s "$REPORTS/risky.md"
          [[ "$RISKY" == failure ]] || { echo "::error::The risky skill passed the scan"; exit 1; }
          [[ "$(skillspector --version)" == "SkillSpector v$VERSION" ]] || { echo "::error::Version output does not match"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scan.sh
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.19
          enable-cache: false
      - run: uvx zizmor@1.30.1 --format github .
        env:
          GH_TOKEN: ${{ github.token }}
